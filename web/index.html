<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Benilla — original client WASM</title>
    <style>
      html, body, #benilla { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #000; }
      #benilla { display: block; touch-action: none; }
      #benilla-bootstrap-status { position: fixed; inset: 0; display: grid; place-items: center; color: #ffd778; background: #000; font: 18px sans-serif; pointer-events: none; }
      #benilla-bootstrap-status[hidden] { display: none; }
      #benilla-local-addons-dialog {
        width: min(920px, calc(100vw - 32px));
        height: min(780px, calc(100dvh - 32px));
        max-width: none;
        max-height: none;
        padding: 0;
        overflow: hidden;
        border: 1px solid #9a7a3a;
        border-radius: 8px;
        background: #0b0d12;
        color: #ffd778;
        box-shadow: 0 16px 48px #000b;
      }
      #benilla-local-addons-dialog::backdrop { background: #000b; }
      #benilla-local-addons-dialog header {
        height: 44px;
        padding: 0 12px 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #514329;
        font: 600 16px "Trebuchet MS", Verdana, sans-serif;
      }
      #benilla-local-addons-close {
        padding: 4px 12px;
        border: 1px solid #9a7a3a;
        border-radius: 4px;
        background: #241a12;
        color: #ffd778;
        font: inherit;
        cursor: pointer;
      }
      #benilla-local-addons-close:hover { background: #392519; }
      #benilla-local-addons-frame {
        width: 100%;
        height: calc(100% - 44px);
        border: 0;
        display: block;
        background: #0b0d12;
      }
      @media (max-width: 600px) {
        #benilla-local-addons-dialog {
          width: calc(100vw - 16px);
          height: calc(100dvh - 16px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="benilla"></canvas>
    <div id="benilla-bootstrap-status" role="status" aria-live="polite"></div>
    <dialog id="benilla-local-addons-dialog" aria-labelledby="benilla-local-addons-title">
      <header>
        <span id="benilla-local-addons-title"></span>
        <button id="benilla-local-addons-close" type="button"></button>
      </header>
      <iframe id="benilla-local-addons-frame" title=""></iframe>
    </dialog>
    <script>
      const addonsDialog = document.getElementById('benilla-local-addons-dialog');
      const addonsFrame = document.getElementById('benilla-local-addons-frame');
      globalThis.openLocalAddonsDialog = () => {
        if (!addonsDialog || typeof addonsDialog.showModal !== 'function') return false;
        addonsFrame.src = '/addons.html?embedded=1';
        addonsDialog.showModal();
        document.getElementById('benilla-local-addons-close').focus();
        return true;
      };
      document.getElementById('benilla-local-addons-close').addEventListener('click', () => {
        addonsDialog.close();
      });
      addonsDialog.addEventListener('close', () => {
        addonsFrame.src = 'about:blank';
      });
      addonsDialog.addEventListener('click', event => {
        if (event.target === addonsDialog) addonsDialog.close();
      });
    </script>
    <script src="./config.js"></script>
    <script src="./i18n.js"></script>
    <script src="./bootstrap-errors.js"></script>
    <script type="module">
      import './mobile-controls.js';

      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./local-addons-sw.js');
          await navigator.serviceWorker.ready;
        } catch (error) {
          console.warn('local add-ons: service worker unavailable', error);
        }
      }
      const gateway = new URL(globalThis.BENILLA_CONFIG.gateway || location.origin, location.href);
      if (!['http:', 'https:'].includes(gateway.protocol) || gateway.search || gateway.hash || gateway.username || gateway.password) {
        throw new Error('BENILLA_CONFIG.gateway must be an HTTP(S) URL without credentials, query or fragment');
      }
      const base = gateway.href.replace(/\/$/, '');
      const socketBase = base.replace(/^http/, 'ws');
      const locale = globalThis.BENILLA_I18N.locale;
      const localized = `${base}/assets/v1/locale/${locale}`;
      // Account creation is the stack's separate `accounts` service. An explicit
      // BENILLA_CONFIG.accounts wins; otherwise the same host's 8088 port, where
      // the loopback-only accounts page lives.
      const accountHost = (() => {
        const host = location.hostname || 'localhost';
        return host.includes(':') && !host.startsWith('[') ? `[${host}]` : host;
      })();
      const accounts = globalThis.BENILLA_CONFIG.accounts
        || `http://${accountHost}:8088/`;
      globalThis.BENILLA_ENDPOINTS = Object.freeze({
        locale,
        assets: `${localized}/file`,
        presence: localized,
        locales: `${base}/assets/v1`,
        accounts,
        auth: `${socketBase}/game/v1/auth`,
        world: `${socketBase}/game/v1/world`,
      });
      // Every locale file is checked against the en_GB base before the client
      // starts. A missing or unknown key rejects this promise, and the page
      // shows the service's own error instead of booting half-translated.
      const status = document.getElementById('benilla-bootstrap-status');
      try {
        await globalThis.BENILLA_I18N.ready;
      } catch (error) {
        status.hidden = false;
        status.textContent = error.message;
        console.error('Benilla i18n failed', error);
        throw error;
      }
      const addonsDialogTitle = globalThis.BENILLA_I18N.text('addons.dialog_title');
      document.getElementById('benilla-local-addons-title').textContent = addonsDialogTitle;
      document.getElementById('benilla-local-addons-frame').title = addonsDialogTitle;
      document.getElementById('benilla-local-addons-close').textContent =
        globalThis.BENILLA_I18N.text('addons.close');
      status.hidden = false;
      status.textContent = globalThis.BENILLA_I18N.text('client_loading');
      import('./pkg-full/benilla.js').then(({ default: init }) => init()).catch(error => {
        status.hidden = false;
        status.textContent = globalThis.BENILLA_I18N.text('client_failed');
        console.error('Benilla failed to start', error);
      });
    </script>
  </body>
</html>
