<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benilla — original client WASM</title>
    <style>
      html, body, #benilla { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #000; }
      #benilla { display: block; }
      #benilla-bootstrap-status { position: fixed; inset: 0; display: grid; place-items: center; color: #ffd778; background: #000; font: 18px sans-serif; pointer-events: none; }
      #benilla-bootstrap-status[hidden] { display: none; }
      #benilla-addons-link { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 2147483647; padding: 5px 12px; border: 1px solid #b89545; border-radius: 5px; background: #0b0d12dd; color: #ffd778; font: 13px "Trebuchet MS", Verdana, sans-serif; text-decoration: none; text-shadow: 1px 1px 2px #000; }
    </style>
  </head>
  <body>
    <canvas id="benilla"></canvas>
    <a id="benilla-addons-link" href="/addons.html" target="_blank" rel="noopener noreferrer">Add-ons locaux</a>
    <div id="benilla-bootstrap-status" role="status" aria-live="polite"></div>
    <script src="./config.js"></script>
    <script src="./i18n.js"></script>
    <script src="./bootstrap-errors.js"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./local-addons-sw.js');
          await navigator.serviceWorker.ready;
        } catch (error) {
          console.warn('local add-ons: service worker unavailable', error);
        }
      }
      const gateway = new URL(globalThis.BENILLA_CONFIG.gateway || location.origin, location.href);
      if (!['http:', 'https:'].includes(gateway.protocol) || gateway.search || gateway.hash || gateway.username || gateway.password) {
        throw new Error('BENILLA_CONFIG.gateway must be an HTTP(S) URL without credentials, query or fragment');
      }
      const base = gateway.href.replace(/\/$/, '');
      const socketBase = base.replace(/^http/, 'ws');
      const locale = globalThis.BENILLA_I18N.locale;
      const localized = `${base}/assets/v1/locale/${locale}`;
      // Account creation is the stack's separate `accounts` service. An explicit
      // BENILLA_CONFIG.accounts wins; otherwise the same host's 8088 port, where
      // the loopback-only accounts page lives.
      const accountHost = (() => {
        const host = location.hostname || 'localhost';
        return host.includes(':') && !host.startsWith('[') ? `[${host}]` : host;
      })();
      const accounts = globalThis.BENILLA_CONFIG.accounts
        || `http://${accountHost}:8088/`;
      globalThis.BENILLA_ENDPOINTS = Object.freeze({
        locale,
        assets: `${localized}/file`,
        presence: localized,
        locales: `${base}/assets/v1`,
        accounts,
        auth: `${socketBase}/game/v1/auth`,
        world: `${socketBase}/game/v1/world`,
      });
      // Every locale file is checked against the en_GB base before the client
      // starts. A missing or unknown key rejects this promise, and the page
      // shows the service's own error instead of booting half-translated.
      const status = document.getElementById('benilla-bootstrap-status');
      try {
        await globalThis.BENILLA_I18N.ready;
      } catch (error) {
        status.hidden = false;
        status.textContent = error.message;
        console.error('Benilla i18n failed', error);
        throw error;
      }
      status.hidden = false;
      status.textContent = globalThis.BENILLA_I18N.text('client_loading');
      import('./pkg-full/benilla.js').then(({ default: init }) => init()).catch(error => {
        status.hidden = false;
        status.textContent = globalThis.BENILLA_I18N.text('client_failed');
        console.error('Benilla failed to start', error);
      });
    </script>
  </body>
</html>
